<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管住嘴的100天 — 排行榜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top: #6EC1E8;
    --sky-bottom: #BFE8F7;
    --card: #FFFFFF;
    --card-warm: #FFF7E6;
    --text: #2C3E50;
    --text-dim: #7C8FA3;
    --orange: #FF8A3D;
    --red: #F2545B;
    --green: #6FBE44;
    --gold: #FFC53D;
    --blue: #4FB6E8;
    --line: #E3EEF5;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 340px, #F4FAFD 340px);
    color: var(--text);
    font-family:'Noto Sans TC', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{ max-width: 900px; margin:0 auto; padding: 24px 16px 50px; }

  .title-badge{
    text-align:center;
    margin-bottom: 18px;
  }
  h1{
    font-family:'ZCOOL KuaiLe', sans-serif;
    font-size: 34px;
    margin: 0 0 4px;
    background: linear-gradient(90deg, var(--green), var(--orange) 55%, var(--red));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 2px 0 rgba(255,255,255,0.4);
  }
  .tagline{
    font-size: 13px;
    color: #fff;
    font-weight: 700;
    margin: 0;
  }

  .clock{
    background: var(--card);
    border-radius: 20px;
    padding: 18px 20px;
    margin-bottom: 14px;
    box-shadow: 0 6px 16px rgba(50,100,140,0.12);
  }
  .clock-row{ display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; }
  .clock-day{ font-family:'ZCOOL KuaiLe', sans-serif; font-size: 36px; color: var(--orange); line-height:1; }
  .clock-day span{ font-size:15px; color: var(--text-dim); font-family:'Noto Sans TC', sans-serif; font-weight:500; }
  .clock-label{ font-size: 12px; color: var(--text-dim); }
  .track{ margin-top:12px; height:12px; background:#F0F0F0; border-radius:10px; overflow:hidden; }
  .track-fill{ height:100%; background: linear-gradient(90deg, var(--green), var(--orange)); border-radius:10px; }

  .stats{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-bottom:22px; }
  .stat{
    background: var(--card);
    border-radius: 16px;
    padding: 14px 10px;
    text-align:center;
    box-shadow: 0 4px 10px rgba(50,100,140,0.08);
  }
  .stat-num{ font-family:'ZCOOL KuaiLe', sans-serif; font-size: 24px; color: var(--blue); }
  .stat-num.good{ color: var(--green); }
  .stat-label{ font-size: 11px; color: var(--text-dim); margin-top:2px; }

  .section-title{
    font-family:'ZCOOL KuaiLe', sans-serif;
    font-size: 18px;
    color: var(--text);
    margin: 22px 4px 10px;
    display:flex; align-items:center; gap:6px;
  }

  .roster{ display:flex; flex-direction:column; gap:8px; }
  .row{
    background: var(--card);
    border-radius: 14px;
    padding: 10px 14px;
    display:grid;
    grid-template-columns: 40px 1fr 58px 58px 66px;
    align-items:center;
    box-shadow: 0 3px 8px rgba(50,100,140,0.07);
  }
  .row.top1{ background: linear-gradient(90deg, #FFF3D6, #FFFFFF); border: 2px solid var(--gold); }
  .row.top2{ background: linear-gradient(90deg, #EAF6FF, #FFFFFF); border: 2px solid var(--blue); }
  .row.top3{ background: linear-gradient(90deg, #F1FBE9, #FFFFFF); border: 2px solid var(--green); }
  .row.header{
    background:transparent; box-shadow:none; padding: 0 14px;
    font-size: 11px; color: var(--text-dim); font-weight:700;
  }
  .rank{ font-family:'ZCOOL KuaiLe', sans-serif; font-size:20px; text-align:center; color: var(--text-dim); }
  .name-cell{ display:flex; flex-direction:column; }
  .nickname{ font-weight:700; font-size:14px; }
  .supervisor{ font-size:11px; color: var(--text-dim); }
  .pct{ font-weight:700; font-size:13px; text-align:right; color: var(--text); }
  .badge{ font-size:11px; text-align:center; padding:4px 6px; border-radius:20px; font-weight:700; }
  .badge.pass{ background: #E8F7DE; color: var(--green); }
  .badge.active{ background: #F1F1F1; color: var(--text-dim); }

  .chart-box{
    background: var(--card);
    border-radius: 18px;
    padding: 16px;
    height: 250px;
    box-shadow: 0 4px 10px rgba(50,100,140,0.08);
  }
  .legend{ display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; font-size:12px; color: var(--text-dim); justify-content:center; }
  .legend span{ display:flex; align-items:center; gap:5px; font-weight:600; }
  .dot{ width:9px; height:9px; border-radius:50%; }

  .footer-note{ text-align:center; font-size:11px; color: var(--text-dim); margin-top:22px; }
  .empty{ text-align:center; padding:24px; color: var(--text-dim); font-size:13px; }

  @media (max-width:480px){
    .row{ grid-template-columns:32px 1fr 48px 48px 56px; padding:9px 10px; }
    h1{ font-size:26px; }
    .clock-day{ font-size:28px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="title-badge">
    <h1>管住嘴的100天</h1>
    <p class="tagline">杜絕嘴饞，瘦出更好的自己！</p>
  </div>

  <div class="clock">
    <div class="clock-row">
      <div class="clock-day" id="dayNum">--<span> / 100 天</span></div>
      <div class="clock-label" id="updatedAt">載入中...</div>
    </div>
    <div class="track"><div class="track-fill" id="trackFill" style="width:0%"></div></div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-num" id="totalPlayers">--</div><div class="stat-label">報名人數</div></div>
    <div class="stat"><div class="stat-num good" id="passedCount">--</div><div class="stat-label">已達標 🎉</div></div>
    <div class="stat"><div class="stat-num" id="reportRate">--</div><div class="stat-label">今日回報率</div></div>
  </div>

  <div class="section-title">🏆 排行榜</div>
  <div class="roster" id="roster">
    <div class="row header">
      <div style="text-align:center">名次</div><div>暱稱</div><div style="text-align:right">減重%</div><div style="text-align:right">減脂%</div><div style="text-align:center">狀態</div>
    </div>
    <div class="empty" id="rosterEmpty" style="display:none">尚無資料，等候第一次回報彙總。</div>
  </div>

  <div class="section-title">📈 前三名減重趨勢(轉橫向重整後顯示前五名)</div>
  <div class="chart-box"><canvas id="trendChart"></canvas></div>
  <div class="legend" id="legend"></div>

  <p class="footer-note">資料每日 00:10 自動更新</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const seriesColors = ['#FFC53D', '#4FB6E8', '#6FBE44', '#F2545B', '#FF8A3D'];
const medals = ['🥇','🥈','🥉'];

function pct(v){ return (v===null || v===undefined || v==='') ? '—' : (v*100).toFixed(1)+'%'; }

async function loadDashboard(){
  try{
    const lbRes = await fetch('./data/leaderboard.json', {cache:'no-store'});
    const lb = await lbRes.json();
    renderMeta(lb.meta);
    renderRoster(lb.leaderboard);
    await renderTrend(lb.leaderboard, lb.meta.day);
  }catch(err){
    document.getElementById('rosterEmpty').style.display = 'block';
    document.getElementById('rosterEmpty').textContent = '資料載入失敗，請確認 data/leaderboard.json 是否存在。';
    console.error(err);
  }
}

function renderMeta(meta){
  document.getElementById('dayNum').innerHTML = `${meta.day}<span> / ${meta.totalDays} 天</span>`;
  document.getElementById('trackFill').style.width = Math.min(100, (meta.day/meta.totalDays*100)) + '%';
  document.getElementById('updatedAt').textContent = '更新於 ' + meta.updatedAt;
  document.getElementById('totalPlayers').textContent = meta.totalPlayers;
  document.getElementById('passedCount').textContent = meta.passedCount;
  document.getElementById('reportRate').textContent = Math.round(meta.reportRateToday*100) + '%';
}

function renderRoster(list){
  const container = document.getElementById('roster');
  if(!list || !list.length){
    document.getElementById('rosterEmpty').style.display = 'block';
    return;
  }
  list.forEach(p => {
    const row = document.createElement('div');
    row.className = 'row' + (p.rank<=3 ? ' top'+p.rank : '');
    const rankDisplay = p.rank<=3 ? medals[p.rank-1] : String(p.rank).padStart(2,'0');
    row.innerHTML = `
      <div class="rank">${rankDisplay}</div>
      <div class="name-cell"><span class="nickname">${p.nickname}</span></div>
      <div class="pct">${pct(p.weightPct)}</div>
      <div class="pct">${pct(p.fatPct)}</div>
      <div><span class="badge ${p.passed?'pass':'active'}">${p.passed?'達標':'進行中'}</span></div>
    `;
    container.appendChild(row);
  });
}

// ===== HMAC-SHA256金鑰流 + XOR解密（跟Apps Script那端演算法完全對稱，用於解密前N名的歷史金鑰已公開的資料）=====
async function hmacKeystream(keyStr, numBytes){
  const enc = new TextEncoder();
  const cryptoKey = await crypto.subtle.importKey('raw', enc.encode(keyStr), {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
  const blockSize = 32;
  const numBlocks = Math.ceil(numBytes / blockSize);
  const keystream = new Uint8Array(numBlocks * blockSize);
  for (let i = 0; i < numBlocks; i++){
    const sig = await crypto.subtle.sign('HMAC', cryptoKey, enc.encode(String(i))); // 計數器用字串(跟GAS端一致)，而非二進位byte
    keystream.set(new Uint8Array(sig), i * blockSize);
  }
  return keystream.slice(0, numBytes);
}

async function xorDecrypt(base64Cipher, keyStr){
  const binStr = atob(base64Cipher);
  const cipherBytes = Uint8Array.from(binStr, c => c.charCodeAt(0));
  const keystream = await hmacKeystream(keyStr, cipherBytes.length);
  const plainBytes = cipherBytes.map((b, i) => b ^ keystream[i]);
  return new TextDecoder('utf-8', {fatal:true}).decode(plainBytes);
}

// ===== 單向雜湊鏈：從已知某天(今天)的公開金鑰，往回推算更早之前任一天的金鑰 =====
async function chainStep(keyHex){
  const enc = new TextEncoder();
  const cryptoKey = await crypto.subtle.importKey('raw', enc.encode(keyHex), {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', cryptoKey, enc.encode('chain-step'));
  return [...new Uint8Array(sig)].map(b => b.toString(16).padStart(2,'0')).join('');
}

async function deriveKeyForDay(knownKeyHex, knownDayIndex, targetDayIndex){
  let k = knownKeyHex;
  const hops = knownDayIndex - targetDayIndex;
  for (let i = 0; i < hops; i++) k = await chainStep(k);
  return k;
}

const ACTIVITY_START_DATE = '2026-08-24'; // 需與Apps Script的CONFIG.ACTIVITY_START_DATE保持一致
// 跟GAS端toDayIndex()完全對稱：格式化成純日期字串後，用UTC正午重新解析比較，避開時區造成的日界位移
function dayIndexFromDate(dateStr){
  const d1 = new Date(dateStr + 'T12:00:00Z');
  const d0 = new Date(ACTIVITY_START_DATE + 'T12:00:00Z');
  return Math.round((d1 - d0) / 86400000) + 1;
}

// 降採樣：把100天份的每日資料點，稀疏化成大約15~18個點，趨勢線形狀不變但視覺上不再擁擠
function downsampleDates(dates, maxPoints) {
  if (dates.length <= maxPoints) return dates;
  const step = Math.ceil(dates.length / maxPoints);
  const sampled = dates.filter((_, i) => i % step === 0);
  if (sampled[sampled.length - 1] !== dates[dates.length - 1]) sampled.push(dates[dates.length - 1]);
  return sampled;
}

// 只有「當天的衍生金鑰」隨排行榜一起公開的前N名，才能被解密畫出趨勢線；
// 這把金鑰只能回推「今天以前」的資料，其餘選手的歷史檔案完全解不開，不會出現在這張圖上。
async function renderTrend(leaderboard, todayDayIndex){
  const isNarrowScreen = window.innerWidth < 480;
  const topN = isNarrowScreen ? 3 : 5;
  const candidates = leaderboard.filter(p => p.histKey).slice(0, topN);

  const results = await Promise.all(candidates.map(async p => {
    try {
      const res = await fetch(`./data/history/${p.pid}.json`, {cache:'no-store'});
      if (!res.ok) return [];
      const encryptedByDate = await res.json();
      const rows = [];
      for (const date of Object.keys(encryptedByDate)) {
        try {
          const dayIdx = dayIndexFromDate(date);
          const dayKey = await deriveKeyForDay(p.histKey, todayDayIndex, dayIdx);
          const decrypted = JSON.parse(await xorDecrypt(encryptedByDate[date], dayKey));
          rows.push({ date, weightPct: decrypted.weightPct, fatPct: decrypted.fatPct });
        } catch (dayErr) { /* 單日解密失敗就略過，不影響其他天 */ }
      }
      return rows;
    } catch (err) {
      console.error('解密失敗', p.nickname, err);
      return [];
    }
  }));

  const allDatesSet = new Set();
  results.forEach(rows => rows.forEach(r => allDatesSet.add(r.date)));
  const allDates = [...allDatesSet].sort();
  const dates = downsampleDates(allDates, 16);

  const datasets = candidates.map((p, idx) => {
    const byDate = Object.fromEntries(results[idx].map(r => [r.date, r.weightPct]));
    return {
      label: p.nickname,
      data: dates.map(d => byDate[d] !== undefined ? +(byDate[d]*100).toFixed(1) : null),
      borderColor: seriesColors[idx],
      backgroundColor: seriesColors[idx],
      borderWidth: 2.5,
      pointRadius: 0,
      pointHoverRadius: 5,
      pointHitRadius: 12,
      spanGaps: true,
      tension: 0.35
    };
  });

  new Chart(document.getElementById('trendChart'), {
    type: 'line',
    data: { labels: dates, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display:false } },
      scales: {
        y: { ticks:{ color:'#7C8FA3', font:{size:10} }, grid:{ color:'#E3EEF5' }, title:{display:true, text:'減重 %', color:'#7C8FA3', font:{size:10}} },
        x: { ticks:{ color:'#7C8FA3', font:{size:9}, maxTicksLimit:8 }, grid:{ display:false } }
      }
    }
  });

  const legend = document.getElementById('legend');
  candidates.forEach((p, idx) => {
    const item = document.createElement('span');
    item.innerHTML = `<span class="dot" style="background:${seriesColors[idx]}"></span>${p.nickname}`;
    legend.appendChild(item);
  });
}

loadDashboard();
</script>
</body>
</html>
