<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管住嘴的100天 — 我的進度</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top: #6EC1E8; --sky-bottom: #BFE8F7;
    --card: #FFFFFF; --text: #2C3E50; --text-dim: #7C8FA3;
    --orange: #FF8A3D; --red: #F2545B; --green: #6FBE44; --blue: #4FB6E8; --gold:#FFC53D;
    --line: #E3EEF5;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 260px, #F4FAFD 260px);
    color: var(--text);
    font-family:'Noto Sans TC', sans-serif;
  }
  .wrap{ max-width: 640px; margin:0 auto; padding: 24px 16px 50px; }
  .title-badge{ text-align:center; margin-bottom: 18px; }
  h1{
    font-family:'ZCOOL KuaiLe', sans-serif; font-size: 28px; margin:0 0 4px;
    background: linear-gradient(90deg, var(--green), var(--orange) 55%, var(--red));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tagline{ font-size: 13px; color:#fff; font-weight:700; margin:0; }

  .state-card{
    background: var(--card); border-radius: 20px; padding: 28px 20px;
    box-shadow: 0 6px 16px rgba(50,100,140,0.12); text-align:center;
  }
  .state-card p{ font-size:14px; color: var(--text-dim); line-height:1.7; margin:0; }
  .spinner{
    width:28px; height:28px; margin:0 auto 14px;
    border: 3px solid var(--line); border-top-color: var(--orange); border-radius:50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin{ to { transform: rotate(360deg); } }
  .static-icon{ font-size:32px; margin-bottom:10px; }

  .result{ display:none; }
  .profile-card{
    background: var(--card); border-radius: 18px; padding: 18px 20px; margin-bottom: 14px;
    box-shadow: 0 4px 10px rgba(50,100,140,0.08);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  .profile-name{ font-family:'ZCOOL KuaiLe', sans-serif; font-size:22px; }
  .rank-pill{
    font-family:'ZCOOL KuaiLe', sans-serif; font-size:15px;
    background: linear-gradient(90deg, var(--gold), var(--orange)); color:#fff;
    padding: 6px 16px; border-radius: 20px;
  }

  .stats{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:18px; }
  .stat{ background:var(--card); border-radius:16px; padding:14px; text-align:center; box-shadow: 0 4px 10px rgba(50,100,140,0.08); }
  .stat-num{ font-family:'ZCOOL KuaiLe', sans-serif; font-size:26px; color: var(--blue); }
  .stat-label{ font-size:11px; color:var(--text-dim); margin-top:2px; }

  .chart-box{ background:var(--card); border-radius:18px; padding:16px; height:260px; box-shadow: 0 4px 10px rgba(50,100,140,0.08); }
  .legend{ display:flex; gap:14px; justify-content:center; margin-top:10px; font-size:12px; color:var(--text-dim); font-weight:600; }
  .legend span{ display:flex; align-items:center; gap:5px; }
  .dot{ width:9px; height:9px; border-radius:50%; }
  .back-link{ display:block; text-align:center; margin-top:20px; font-size:13px; color: var(--blue); text-decoration:none; font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="title-badge">
    <h1>我的進度</h1>
    <p class="tagline">只有你自己的專屬連結才看得到這頁</p>
  </div>

  <div class="state-card" id="stateCard">
    <div class="spinner" id="spinnerIcon"></div>
    <p id="stateMsg">正在解密你的資料...</p>
  </div>

  <div class="result" id="result">
    <div class="profile-card">
      <div><div class="profile-name" id="pName">--</div></div>
      <div class="rank-pill" id="pRank">排名 --</div>
    </div>

    <div class="stats">
      <div class="stat"><div class="stat-num" id="pWeight">--</div><div class="stat-label">減重進度</div></div>
      <div class="stat"><div class="stat-num" id="pFat">--</div><div class="stat-label">減脂進度</div></div>
    </div>

    <div class="chart-box"><canvas id="myChart"></canvas></div>
    <div class="legend">
      <span><span class="dot" style="background:#FF8A3D"></span>減重%</span>
      <span><span class="dot" style="background:#4FB6E8"></span>減脂%</span>
    </div>
  </div>

  <!--<a class="back-link" href="./index.html">← 回排行榜</a>-->
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
let chartInstance = null;

function pct(v){ return (v===null || v===undefined || v==='') ? '—' : (v*100).toFixed(1)+'%'; }

function setState(msg, isError){
  document.getElementById('stateMsg').textContent = msg;
  if (isError) document.querySelector('.spinner').style.display = 'none';
}

// ===== HMAC-SHA256金鑰流 + XOR解密（跟Apps Script那端演算法完全對稱）=====
async function hmacKeystream(keyStr, numBytes){
  const enc = new TextEncoder();
  const cryptoKey = await crypto.subtle.importKey('raw', enc.encode(keyStr), {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
  const blockSize = 32;
  const numBlocks = Math.ceil(numBytes / blockSize);
  const keystream = new Uint8Array(numBlocks * blockSize);
  for (let i = 0; i < numBlocks; i++){
    const sig = await crypto.subtle.sign('HMAC', cryptoKey, enc.encode(String(i))); // 計數器用字串(跟GAS端一致)，而非二進位byte
    keystream.set(new Uint8Array(sig), i * blockSize);
  }
  return keystream.slice(0, numBytes);
}

async function xorDecrypt(base64Cipher, keyStr){
  const binStr = atob(base64Cipher);
  const cipherBytes = Uint8Array.from(binStr, c => c.charCodeAt(0));
  const keystream = await hmacKeystream(keyStr, cipherBytes.length);
  const plainBytes = cipherBytes.map((b, i) => b ^ keystream[i]);
  return new TextDecoder('utf-8', {fatal:true}).decode(plainBytes); // fatal:true讓無效UTF-8直接拋錯，代表金鑰錯誤
}

// ===== 單向雜湊鏈：從已知某天的金鑰(這裡是選手自己的種子)，往回推算任一天的金鑰 =====
async function chainStep(keyHex){
  const enc = new TextEncoder();
  const cryptoKey = await crypto.subtle.importKey('raw', enc.encode(keyHex), {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', cryptoKey, enc.encode('chain-step'));
  return [...new Uint8Array(sig)].map(b => b.toString(16).padStart(2,'0')).join('');
}

async function deriveKeyForDay(knownKeyHex, knownDayIndex, targetDayIndex){
  let k = knownKeyHex;
  const hops = knownDayIndex - targetDayIndex;
  for (let i = 0; i < hops; i++) k = await chainStep(k);
  return k;
}

const ACTIVITY_START_DATE = '2026-08-24'; // 需與Apps Script的CONFIG.ACTIVITY_START_DATE保持一致
const TOTAL_DAYS = 100; // 需與CONFIG.TOTAL_DAYS保持一致
// 跟GAS端toDayIndex()完全對稱：格式化成純日期字串後，用UTC正午重新解析比較，避開時區造成的日界位移
function dayIndexFromDate(dateStr){
  const d1 = new Date(dateStr + 'T12:00:00Z');
  const d0 = new Date(ACTIVITY_START_DATE + 'T12:00:00Z');
  return Math.round((d1 - d0) / 86400000) + 1;
}

function downsampleRows(rows, maxPoints) {
  if (rows.length <= maxPoints) return rows;
  const step = Math.ceil(rows.length / maxPoints);
  const sampled = rows.filter((_, i) => i % step === 0);
  if (sampled[sampled.length - 1] !== rows[rows.length - 1]) sampled.push(rows[rows.length - 1]);
  return sampled;
}

// 個人成績功能開放日：在這之前(不含當天前)，起始體重/體脂資料還沒蒐集齊，
// 每日彙總也還沒開始正式排程，此時顯示「敬請期待」而非解密錯誤，避免造成選手誤會系統壞掉。
const STATS_AVAILABLE_DATE = '2026-08-31';

function showComingSoon(){
  document.querySelector('.spinner').style.display = 'none';
  const icon = document.createElement('div');
  icon.className = 'static-icon';
  icon.textContent = '📊';
  document.getElementById('stateCard').prepend(icon);
  document.getElementById('stateMsg').innerHTML =
    `個人成績查詢功能尚未開放<br>敬請期待！<br><br>` +
    `<span style="font-size:12px; color:var(--text-dim);">開賽初期正在蒐集大家的起始體重/體脂資料，` +
    `預計 ${STATS_AVAILABLE_DATE.replace('2026-','').replace('-','/')} 起開放查詢，請耐心等候～</span>`;
}

async function init(){
  const today = new Date();
  const availableDate = new Date(STATS_AVAILABLE_DATE + 'T00:00:00');
  if (today < availableDate) {
    showComingSoon();
    return;
  }

  const params = new URLSearchParams(window.location.search);
  const pid = params.get('p');   // 公開代碼
  const key = params.get('c');   // 歷史金鑰（注意：不是表單驗證碼）

  if (!pid || !key) {
    setState('請透過你自己收到的專屬連結開啟本頁，無法直接查詢其他人的資料。', true);
    return;
  }

  try {
    const lbRes = await fetch('./data/leaderboard.json', {cache:'no-store'});
    const lb = await lbRes.json();
    const player = lb.leaderboard.find(p => p.pid === pid);
    if (!player) { setState('查無此參賽編號，請確認連結是否正確。', true); return; }

    // 逐日解密：檔案內容現在是 {日期: base64密文} 的物件，選手自己的金鑰(c參數)等於第100天(種子)，
    // 對每一天各自推算出當天的金鑰再解密；金鑰或某天資料不對，該天會被跳過而不是整份掛掉。
    const histRes = await fetch(`./data/history/${pid}.json`, {cache:'no-store'});
    let myRows = [];
    if (histRes.ok) {
      const encryptedByDate = await histRes.json();
      const dates = Object.keys(encryptedByDate);
      for (const date of dates) {
        try {
          const dayIdx = dayIndexFromDate(date);
          const dayKey = await deriveKeyForDay(key, TOTAL_DAYS, dayIdx);
          const decrypted = JSON.parse(await xorDecrypt(encryptedByDate[date], dayKey));
          myRows.push({ date, weightPct: decrypted.weightPct, fatPct: decrypted.fatPct });
        } catch (dayErr) {
          console.warn(`${date} 解密失敗，略過`, dayErr);
        }
      }
      myRows.sort((a,b) => a.date.localeCompare(b.date));
      if (dates.length && myRows.length === 0) {
        // 一整份資料都解不開，才視為金鑰本身錯誤；單日解不開只是略過那天
        throw new Error('所有日期皆解密失敗，金鑰可能不正確');
      }
    }

    document.getElementById('pName').textContent = player.nickname;
    document.getElementById('pRank').textContent = player.passed ? `排名 第${player.rank}名` : '進行中';
    document.getElementById('pWeight').textContent = pct(player.weightPct);
    document.getElementById('pFat').textContent = pct(player.fatPct);
    renderChart(myRows);

    document.getElementById('stateCard').style.display = 'none';
    document.getElementById('result').style.display = 'block';
  } catch (err) {
    setState('驗證失敗，連結可能不完整或已失效，請聯繫管理員。', true);
    console.error(err);
  }
}

function renderChart(rows){
  if(chartInstance) chartInstance.destroy();
  const displayRows = downsampleRows(rows, 18);
  const labels = displayRows.map(r => r.date);
  chartInstance = new Chart(document.getElementById('myChart'), {
    type:'line',
    data:{
      labels,
      datasets:[
        { label:'減重%', data: displayRows.map(r=>r.weightPct!==''?+(r.weightPct*100).toFixed(1):null), borderColor:'#FF8A3D', backgroundColor:'#FF8A3D', borderWidth:2.5, pointRadius:0, pointHoverRadius:5, pointHitRadius:12, tension:0.35, spanGaps:true },
        { label:'減脂%', data: displayRows.map(r=>r.fatPct!==''?+(r.fatPct*100).toFixed(1):null), borderColor:'#4FB6E8', backgroundColor:'#4FB6E8', borderWidth:2.5, pointRadius:0, pointHoverRadius:5, pointHitRadius:12, tension:0.35, spanGaps:true }
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction: { mode: 'index', intersect: false },
      plugins:{ legend:{ display:false } },
      scales:{
        y:{ ticks:{ color:'#7C8FA3', font:{size:10} }, grid:{ color:'#E3EEF5' }, title:{display:true,text:'%',color:'#7C8FA3',font:{size:10}} },
        x:{ ticks:{ color:'#7C8FA3', font:{size:9}, maxTicksLimit:8 }, grid:{ display:false } }
      }
    }
  });
}

init();
</script>
</body>
</html>
